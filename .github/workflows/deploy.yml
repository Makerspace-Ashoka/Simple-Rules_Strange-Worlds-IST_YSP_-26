name: Deploy CA Workshop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, docker, ca-workshop]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Deploy
        run: |
          docker compose --env-file /opt/cellular-automata-workshop/.env up -d --build
          docker compose --env-file /opt/cellular-automata-workshop/.env ps

      - name: Health check
        run: |
          sleep 5
          curl -f http://localhost/api/health
